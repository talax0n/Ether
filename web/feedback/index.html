<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ngobrol bareng Etha · Ether</title>
<meta name="description" content="Bantu Etha bikin Ether makin asik. Feedback 2 menit.">
<meta name="theme-color" content="#FFF7EA">
<meta property="og:title" content="Ngobrol bareng Etha · Ether">
<meta property="og:description" content="Bantu Etha bikin Ether makin asik. Feedback 2 menit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1B2E; --cream:#FFF7EA; --paper:#FFFFFF;
  --coral:#FF5A36; --coral-d:#D93E1C; --sun:#FFC233; --mint:#2BD47D; --sky:#3BA7FF; --grape:#8B5CF6;
  --sun-soft:#FFE7A8; --mint-soft:#C9F5DD; --sky-soft:#CFE7FF; --grape-soft:#E4D8FF; --coral-soft:#FFD6CB;
  --bg:var(--cream); --surface:var(--paper); --line:var(--ink); --ledge:var(--ink); --text:var(--ink);
  --muted:#5B5670; --track:#ECE6DA; --danger:#B8321A;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17142A; --surface:#26223D; --line:#07060D; --ledge:#07060D; --text:#FFF7EA;
    --muted:#C3BDD6; --track:#3A3552; --danger:#FF8A6E;
  }
}
:root[data-theme="dark"]{
  --bg:#17142A; --surface:#26223D; --line:#07060D; --ledge:#07060D; --text:#FFF7EA;
  --muted:#C3BDD6; --track:#3A3552; --danger:#FF8A6E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(color-mix(in srgb,var(--text) 7%,transparent) 1.5px,transparent 2px);
  background-size:22px 22px;
}
button,input,textarea{font:inherit;color:inherit}
main{flex:1;display:flex;flex-direction:column}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}

/* top bar */
.top{display:flex;align-items:center;gap:12px;height:48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
.brand img{width:30px;height:30px;border-radius:9px}
.bar{flex:1;height:18px;border:3px solid var(--line);border-radius:999px;background:var(--track);overflow:hidden;opacity:0;transition:opacity .3s}
.bar.on{opacity:1}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-right:3px solid var(--line);transition:width .5s var(--pop);
  background-image:linear-gradient(transparent 30%,rgba(255,255,255,.55) 30% 45%,transparent 45%)}
.count{font:800 14px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;opacity:0;transition:opacity .3s}
.count.on{opacity:1}

/* Etha + bubble */
.stage{display:flex;align-items:flex-end;gap:6px;margin:18px 0 14px}
.etha{flex:none;width:112px;height:112px;background:var(--sprite) 0 0 / 1344px 896px no-repeat;cursor:pointer;
  animation:bob 3.4s ease-in-out infinite;transform-origin:50% 100%;image-rendering:auto}
.etha.big{width:168px;height:168px;background-size:2016px 1344px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
.bubble{position:relative;flex:1;background:var(--surface);border:3px solid var(--line);border-radius:22px;
  box-shadow:0 5px 0 var(--ledge);padding:14px 16px;margin-bottom:26px}
.bubble::before{content:"";position:absolute;left:-11px;bottom:22px;width:18px;height:18px;background:var(--surface);
  border-left:3px solid var(--line);border-bottom:3px solid var(--line);border-bottom-left-radius:4px;transform:rotate(45deg)}
.who{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--coral-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .who{color:var(--coral)}}
.say{font-size:19px;font-weight:900;line-height:1.3;margin-top:2px;min-height:1.3em}
.say .caret{display:inline-block;width:3px;height:1em;background:currentColor;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{font-size:14px;font-weight:700;color:var(--muted);margin-top:6px}

/* answer area */
.card{background:var(--surface);border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--ledge);padding:18px}
.enter{animation:in .45s var(--pop) both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:3px solid var(--line);border-radius:18px;
  background:var(--surface);box-shadow:0 4px 0 var(--ledge);font-weight:800;font-size:16px;text-align:left;cursor:pointer;
  transition:transform .08s,box-shadow .08s,background .15s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.opt .mk{flex:none;width:26px;height:26px;border:3px solid currentColor;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.opt.sq .mk{border-radius:8px}
.opt[aria-checked="true"]{background:var(--mint-soft);color:var(--ink)}
.opt[aria-checked="true"] .mk{background:var(--mint)}
.opt[aria-checked="true"] .mk::after{content:"";width:10px;height:6px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-1px) rotate(-45deg)}
.opt:nth-child(5n+2)[aria-checked="true"]{background:var(--sky-soft)}
.opt:nth-child(5n+3)[aria-checked="true"]{background:var(--sun-soft)}
.opt:nth-child(5n+4)[aria-checked="true"]{background:var(--grape-soft)}
.opt:nth-child(5n+5)[aria-checked="true"]{background:var(--coral-soft)}
.opt:focus-visible,.num:focus-visible,.btn:focus-visible,.field:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

.field{width:100%;border:3px solid var(--line);border-radius:18px;background:var(--surface);padding:14px 16px;font-size:17px;font-weight:700;
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--text) 8%,transparent);resize:none;outline:none}
.field::placeholder{color:var(--muted);opacity:.8}
textarea.field{min-height:150px;line-height:1.45}
.other{margin-top:10px}
.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);margin-top:8px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.num{aspect-ratio:1;border:3px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--ledge);
  font:800 20px "JetBrains Mono",ui-monospace,monospace;cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s}
.num:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.num[aria-checked="true"]{color:var(--ink);transform:translateY(-3px);box-shadow:0 7px 0 var(--ledge)}
.ends{display:flex;justify-content:space-between;font-size:13px;font-weight:900;color:var(--muted);margin-top:12px}

.err{color:var(--danger);font-weight:800;font-size:14px;margin-top:10px;min-height:20px}
.err:empty{display:none}

/* nav */
.nav{display:flex;gap:12px;margin-top:auto;padding-top:22px}
.btn{min-height:58px;border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--ledge);font-weight:900;font-size:17px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 20px;transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ledge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{flex:1;background:var(--coral);color:var(--ink)}
.btn.back{background:var(--surface);width:58px;padding:0}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.kbd{font-size:12px;font-weight:800;color:var(--muted);text-align:center;margin-top:10px}

/* intro + done */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin:auto 0}
.hero h1{font-size:36px;font-weight:900;line-height:1.05;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{font-size:17px;font-weight:700;color:var(--muted);max-width:380px;line-height:1.45}
.xp{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 16px;border:3px solid var(--line);border-radius:999px;background:var(--sun);
  box-shadow:0 4px 0 var(--ledge);font-weight:900;font-size:18px;color:var(--ink)}
.xp b{font-family:"JetBrains Mono",ui-monospace,monospace}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:380px){.say{font-size:17px}.etha{width:92px;height:92px;background-size:1104px 736px}.hero h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img id="logo" alt="">Ether</div>
    <div class="bar" id="bar" role="progressbar" aria-label="Progres" aria-valuemin="0" aria-valuemax="8"><i id="fill"></i></div>
    <div class="count" id="count"></div>
  </header>
  <main id="view"></main>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfVRtpczZG_BO83EljyRMy4PMO8ifZ3BZrWewU9y72SRcro8A/formResponse";
const OTHER = "__other_option__";

// Option labels must match the Google Form exactly, or Google drops the answer without an error.
const STEPS = [
  { kind: "email", field: "emailAddress",
    say: "Pertama, boleh minta email kamu?", hint: "Biar kami bisa kabarin pas Ether rilis." },
  { kind: "single", field: "entry.2040406162",
    say: "Seberapa sering kamu ikut lomba atau hackathon?",
    options: ["Tidak pernah", "1-2 kali", "3-5 kali", "Lebih dari 5 kali"] },
  { kind: "scale", field: "entry.575055830", min: 1, max: 10, lo: "1 · Gampang", hi: "10 · Susah banget",
    say: "Seberapa sulit kamu menemukan teammate yang cocok?" },
  { kind: "single", field: "entry.959775825", other: true,
    say: "Biasanya kamu cari teammate lewat apa?",
    options: ["Teman / Kenalan", "Group Chat", "Sosial Media", "Komunitas Kampus"] },
  { kind: "text", field: "entry.761017746",
    say: "Menurut kamu, perlu nggak aplikasi seperti Ether dikembangkan?", hint: "Ceritain alasannya juga ya." },
  { kind: "text", field: "entry.529524309",
    say: "Kalau Ether sudah jadi, kamu tertarik pakai nggak?", hint: "Jujur aja, Etha nggak baper kok." },
  { kind: "text", field: "entry.1310067884",
    say: "Fitur apa yang paling kamu butuhkan di aplikasi seperti Ether?" },
  { kind: "multi", field: "entry.234368281", other: true,
    say: "Info apa yang bikin kamu lebih percaya sama calon teammate?", hint: "Boleh pilih lebih dari satu.",
    options: ["Skill", "Portfolio", "Competition Experience", "Achievements"] },
];

// Rows of the inlined Etha sprite (12 columns), cut from app/src/main/res/drawable-nodpi/etha_sheet.png (12 columns).
const MOVES = {
  idle: { row: 0, frames: 12, ms: 83, loop: true }, wave: { row: 1, frames: 11, ms: 68 },
  celebrate: { row: 2, frames: 11, ms: 68 }, look: { row: 3, frames: 8, ms: 100 },
  tap: { row: 4, frames: 8, ms: 100 }, react: { row: 5, frames: 8, ms: 80 },
  hop: { row: 6, frames: 7, ms: 70 }, scratch: { row: 7, frames: 8, ms: 100 },
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = { step: -1, answers: {}, other: {}, sending: false };
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");

let ethaEl = null, ethaTimer = 0, ambientTimer = 0;
function play(name, then = "idle") {
  if (!ethaEl) return;
  const m = MOVES[name], cell = ethaEl.offsetWidth;
  clearTimeout(ethaTimer);
  let f = reduced && !m.loop ? m.frames - 1 : 0;
  const draw = () => (ethaEl.style.backgroundPosition = `${-f * cell}px ${-m.row * cell}px`);
  draw();
  if (reduced) return;
  const tick = () => {
    if (f === m.frames - 1 && !m.loop) return play(then);
    f = (f + 1) % m.frames; draw();
    ethaTimer = setTimeout(tick, m.ms);
  };
  ethaTimer = setTimeout(tick, m.ms);
}
function ambient() {
  clearTimeout(ambientTimer);
  if (reduced) return;
  ambientTimer = setTimeout(() => {
    play(["look", "scratch", "tap", "look", "hop"][Math.floor(Math.random() * 5)]);
    ambient();
  }, 3500 + Math.random() * 3000);
}
function mountEtha(el, first) {
  ethaEl = el;
  el.addEventListener("click", () => play("react"));
  play(first);
  ambient();
}

let typeTimer = 0;
function typeOut(el, text) {
  clearTimeout(typeTimer);
  if (reduced) { el.textContent = text; return; }
  let i = 0;
  const caret = '<span class="caret"></span>';
  const step = () => {
    i = Math.min(text.length, i + 2);
    el.innerHTML = esc(text.slice(0, i)) + (i < text.length ? caret : "");
    if (i < text.length) typeTimer = setTimeout(step, 18);
  };
  step();
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setProgress() {
  const on = state.step >= 0 && state.step < STEPS.length;
  $("#bar").classList.toggle("on", on);
  $("#count").classList.toggle("on", on);
  const n = Math.max(0, state.step);
  $("#fill").style.width = `${(n / STEPS.length) * 100}%`;
  $("#bar").setAttribute("aria-valuenow", n);
  $("#count").textContent = on ? `${n + 1}/${STEPS.length}` : "";
}

const arrow = (d) => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const NEXT = arrow("M5 12h14M13 6l6 6-6 6"), BACK = arrow("M19 12H5M11 6l-6 6 6 6");

function renderIntro() {
  view.innerHTML = `
    <section class="hero enter">
      <div class="etha big" role="img" aria-label="Etha, maskot Ether, melambai"></div>
      <h1>Hai, aku <em>Etha</em>!</h1>
      <p>Aku lagi bantu tim Ether bikin aplikasi cari teammate lomba yang beneran asik. Boleh ngobrol 2 menit?</p>
    </section>
    <nav class="nav"><button class="btn go" id="start">Ayo mulai ${NEXT}</button></nav>`;
  mountEtha($(".etha"), "wave");
  $("#start").onclick = () => go(0);
}

function renderStep() {
  const s = STEPS[state.step], v = state.answers[s.field];
  let body = "";
  if (s.kind === "email") {
    body = `<input class="field" id="in" type="email" inputmode="email" autocomplete="email" placeholder="nama@email.com" aria-label="Email" value="${esc(v || "")}">`;
  } else if (s.kind === "text") {
    body = `<textarea class="field" id="in" maxlength="1000" placeholder="Ketik jawabanmu di sini..." aria-label="${esc(s.say)}">${esc(v || "")}</textarea>
            <div class="meta"><span>Ctrl / ⌘ + Enter untuk lanjut</span><span id="len">${(v || "").length}/1000</span></div>`;
  } else if (s.kind === "scale") {
    const colors = ["--mint-soft", "--sky-soft", "--sun-soft", "--coral-soft"];
    body = `<div class="scale" role="radiogroup" aria-label="${esc(s.say)}">${Array.from({ length: s.max - s.min + 1 }, (_, i) => {
      const n = s.min + i, c = colors[Math.min(3, Math.floor(i / 2.5))];
      return `<button class="num" role="radio" aria-checked="${v === String(n)}" data-v="${n}" style="${v === String(n) ? `background:var(${c})` : ""}" data-c="${c}">${n}</button>`;
    }).join("")}</div><div class="ends"><span>${s.lo}</span><span>${s.hi}</span></div>`;
  } else {
    const multi = s.kind === "multi", sel = multi ? v || [] : [v];
    const opts = [...s.options, ...(s.other ? [OTHER] : [])];
    body = `<div class="opts" role="${multi ? "group" : "radiogroup"}" aria-label="${esc(s.say)}">${opts.map((o) =>
      `<button class="opt ${multi ? "sq" : ""}" role="${multi ? "checkbox" : "radio"}" aria-checked="${sel.includes(o)}" data-v="${esc(o)}"><span class="mk"></span>${o === OTHER ? "Yang lain..." : esc(o)}</button>`
    ).join("")}</div>
    ${s.other ? `<input class="field other" id="other" placeholder="Sebutin yang lain" aria-label="Jawaban lainnya" value="${esc(state.other[s.field] || "")}" ${sel.includes(OTHER) ? "" : "hidden"}>` : ""}`;
  }
  const last = state.step === STEPS.length - 1;
  view.innerHTML = `
    <div class="stage">
      <div class="etha" role="img" aria-label="Etha"></div>
      <div class="bubble"><div class="who">Etha</div><div class="say" id="say"></div>${s.hint ? `<div class="hint">${s.hint}</div>` : ""}</div>
    </div>
    <section class="card enter">${body}<div class="err" id="err" role="alert"></div></section>
    <nav class="nav">
      <button class="btn back" id="back" aria-label="Kembali">${BACK}</button>
      <button class="btn go" id="next">${last ? "Kirim ke Etha" : "Lanjut"} ${NEXT}</button>
    </nav>
    <div class="kbd">${s.kind === "text" ? "" : "Tekan Enter untuk lanjut"}</div>`;
  mountEtha($(".etha"), state.step === 0 ? "wave" : "look");
  typeOut($("#say"), s.say);
  $("#live").textContent = s.say;
  $("#back").onclick = () => go(state.step - 1);
  $("#next").onclick = next;
  wire(s);
  refreshNext();
}

function wire(s) {
  const input = $("#in"), other = $("#other");
  if (input) {
    input.addEventListener("input", () => {
      state.answers[s.field] = input.value;
      if ($("#len")) $("#len").textContent = `${input.value.length}/1000`;
      $("#err").textContent = "";
      refreshNext();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (s.kind !== "text" || e.metaKey || e.ctrlKey)) { e.preventDefault(); next(); }
    });
    setTimeout(() => input.focus({ preventScroll: true }), 350);
  }
  if (other) {
    other.addEventListener("input", () => { state.other[s.field] = other.value; $("#err").textContent = ""; refreshNext(); });
    other.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); next(); } });
  }
  view.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => pick(s, b.dataset.v)));
}

function pick(s, val) {
  if (s.kind === "multi") {
    const cur = new Set(state.answers[s.field] || []);
    cur.has(val) ? cur.delete(val) : cur.add(val);
    state.answers[s.field] = [...cur];
  } else {
    state.answers[s.field] = val;
  }
  const sel = s.kind === "multi" ? state.answers[s.field] : [state.answers[s.field]];
  view.querySelectorAll("[data-v]").forEach((b) => {
    const on = sel.includes(b.dataset.v);
    b.setAttribute("aria-checked", on);
    if (b.dataset.c) b.style.background = on ? `var(${b.dataset.c})` : "";
  });
  const other = $("#other");
  if (other) {
    other.hidden = !sel.includes(OTHER);
    if (!other.hidden && val === OTHER) other.focus();
  }
  $("#err").textContent = "";
  play(sel.length ? "react" : "scratch");
  refreshNext();
  // Single choice moves on by itself, except when the respondent still has to type "Yang lain".
  if ((s.kind === "single" || s.kind === "scale") && val !== OTHER) setTimeout(() => state.step === STEPS.indexOf(s) && next(), 380);
}

function problem(s) {
  const v = state.answers[s.field];
  if (s.kind === "email") return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || "").trim()) ? "" : "Email-nya kayaknya belum valid nih.";
  if (s.kind === "text") return (v || "").trim() ? "" : "Isi dulu ya, satu kalimat juga boleh.";
  const sel = s.kind === "multi" ? v || [] : v ? [v] : [];
  if (!sel.length) return s.kind === "multi" ? "Pilih minimal satu ya." : "Pilih salah satu dulu ya.";
  if (sel.includes(OTHER) && !(state.other[s.field] || "").trim()) return "Tulis jawaban lainnya dulu ya.";
  return "";
}
function refreshNext() { $("#next").disabled = state.sending; }

function next() {
  const s = STEPS[state.step], p = problem(s);
  if (p) { $("#err").textContent = p; play("scratch"); return; }
  if (state.step === STEPS.length - 1) return submit();
  go(state.step + 1);
}

function go(i) {
  if (i < 0) { state.step = -1; renderIntro(); setProgress(); return; }
  state.step = i;
  setProgress();
  renderStep();
}

async function submit() {
  state.sending = true;
  const btn = $("#next");
  btn.disabled = true;
  btn.textContent = "Mengirim...";
  play("tap");
  const body = new URLSearchParams();
  for (const s of STEPS) {
    const v = state.answers[s.field];
    const vals = Array.isArray(v) ? v : [v];
    for (const x of vals) body.append(s.field, s.kind === "email" ? x.trim() : x);
    if (s.other && vals.includes(OTHER)) body.append(`${s.field}.other_option_response`, state.other[s.field].trim());
  }
  try {
    // Google sends no CORS headers, so the response is opaque. A network error is the only failure we can see.
    await fetch(FORM_URL, { method: "POST", mode: "no-cors", body });
    renderDone();
  } catch {
    state.sending = false;
    btn.disabled = false;
    btn.innerHTML = `Coba kirim lagi ${NEXT}`;
    $("#err").textContent = "Gagal terkirim. Cek koneksi internet kamu, lalu coba lagi.";
    play("scratch");
  }
}

function renderDone() {
  state.step = STEPS.length;
  $("#fill").style.width = "100%";
  setTimeout(setProgress, 900);
  view.innerHTML = `
    <section class="hero enter">
      <div class="etha big" role="img" aria-label="Etha merayakan"></div>
      <h1>Makasih banyak!</h1>
      <p>Jawabanmu udah sampai ke tim Ether. Etha bakal pastiin masukanmu kepakai.</p>
      <div class="xp">Feedback terkirim</div>
    </section>`;
  mountEtha($(".etha"), "celebrate");
  $("#live").textContent = "Terkirim. Makasih banyak!";
  if (reduced) return;
  const c = document.createElement("div");
  c.className = "confetti";
  const colors = ["--coral", "--sun", "--mint", "--sky", "--grape"];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = `var(${colors[i % 5]})`;
    p.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    p.style.animationDelay = Math.random() * 0.5 + "s";
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 4500);
}

renderIntro();
setProgress();
</script>
