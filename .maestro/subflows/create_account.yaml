appId: dev.ether.app
---
# Creates an account with email and password; it signs straight in.
# First launch only: the intro pages, then the app opens for browsing without an account.
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Profile"
- tapOn: "Sign in"
- tapOn: "Continue with email"
- tapOn: "Create account"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password.*"
- inputText: "ether-e2e-pass"
- hideKeyboard
# The first "Create account" is the mode tab; the second is the button.
- tapOn:
    text: "Create account"
    index: 1
