appId: dev.ether.app
---
# Signs in an existing account (the seeded demo users use the password ether-demo).
# First launch only: the intro pages, then the app opens for browsing without an account.
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Profile"
- tapOn: "Sign in"
- tapOn: "Continue with email"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD || 'ether-demo'}
- hideKeyboard
# The first "Sign in" is the mode tab; the second is the button.
- tapOn:
    text: "Sign in"
    index: 1
