appId: dev.ether.app
---
- runScript: ../scripts/clear_mail.js
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Continue with email"
- extendedWaitUntil:
    visible: "6-digit code"
    timeout: 15000
- runScript:
    file: ../scripts/otp.js
    env:
      EMAIL: ${EMAIL}
- tapOn: "6-digit code"
- inputText: ${output.otp}
